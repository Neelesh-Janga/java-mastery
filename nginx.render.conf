# Rate-limit zones
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api:10m     rate=15r/s;
limit_req_zone $binary_remote_addr zone=execute:10m rate=4r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens        off;
    client_max_body_size 64k;
    client_body_timeout  10s;
    client_header_timeout 10s;
    send_timeout         10s;
    keepalive_timeout    30s;

    limit_conn  perip 20;
    limit_req   zone=general burst=50 nodelay;

    # Security headers
    add_header X-Frame-Options          "DENY"                            always;
    add_header X-Content-Type-Options   "nosniff"                         always;
    add_header X-XSS-Protection         "1; mode=block"                   always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=(), payment=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; worker-src blob: 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none';" always;
    add_header X-Download-Options       "noopen"                          always;

    # Block dangerous paths
    location ~* \.(php|asp|aspx|jsp|cgi|sh|bash|pl|py|rb|env|git|svn|htaccess|htpasswd|DS_Store|ini|log|bak|sql|tar|gz|zip)$ {
        return 404;
    }
    if ($request_uri ~* "(\.\./|\.\.\\|%2e%2e|%252e|%00)") { return 400; }
    if ($content_type ~* "multipart/form-data") { return 415; }

    # /api/execute — strictest limits
    location = /api/execute {
        limit_req          zone=execute burst=6 nodelay;
        limit_conn         perip 4;
        client_max_body_size 16k;
        limit_except POST { deny all; }

        # Backend runs on localhost in the same container
        # Strip Origin so Spring Boot never does CORS checking on internal proxied requests
        proxy_pass            http://127.0.0.1:8080/api/execute;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header      Origin            "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
        proxy_send_timeout    10s;
        proxy_buffering       off;
    }

    # /api/* — general API
    location /api/ {
        limit_req          zone=api burst=30 nodelay;
        client_max_body_size 32k;
        limit_except GET POST HEAD OPTIONS { deny all; }

        proxy_pass            http://127.0.0.1:8080/api/;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header      Origin            "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    20s;
    }

    # Static assets — long cache
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires    1y;
        add_header Cache-Control          "public, immutable";
        add_header X-Frame-Options        "DENY"    always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
}
