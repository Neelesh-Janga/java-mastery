# ---------------------------------------------------------------------------
# Rate-limit zones
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api:10m     rate=15r/s;
limit_req_zone $binary_remote_addr zone=execute:10m rate=4r/s;

# Shared connection limit: cap concurrent connections per IP
limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # -----------------------------------------------------------------------
    # Hardening — general
    # -----------------------------------------------------------------------
    server_tokens        off;
    client_max_body_size 64k;          # absolute ceiling; execute endpoint is tighter below
    client_body_timeout  10s;
    client_header_timeout 10s;
    send_timeout         10s;
    keepalive_timeout    30s;

    limit_conn  perip 20;
    limit_req   zone=general burst=50 nodelay;

    # -----------------------------------------------------------------------
    # Security headers
    # -----------------------------------------------------------------------
    add_header X-Frame-Options          "DENY"                          always;
    add_header X-Content-Type-Options   "nosniff"                       always;
    add_header X-XSS-Protection         "1; mode=block"                 always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

    # CSP — Monaco Editor requires unsafe-eval + blob workers; everything else locked down
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; worker-src blob: 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none';" always;

    # Prevent open-redirect via meta/header injection
    add_header X-Download-Options "noopen" always;

    # -----------------------------------------------------------------------
    # Block known-bad paths: exploits, hidden files, server-side scripts
    # -----------------------------------------------------------------------
    location ~* \.(php|asp|aspx|jsp|cgi|sh|bash|pl|py|rb|env|git|svn|htaccess|htpasswd|DS_Store|ini|log|bak|sql|tar|gz|zip)$ {
        return 404;
    }

    # Block path traversal attempts
    if ($request_uri ~* "(\.\./|\.\.\\|%2e%2e|%252e)") {
        return 400;
    }

    # Block null bytes
    if ($request_uri ~* "%00") {
        return 400;
    }

    # No upload endpoint exists — reject any multipart body
    if ($content_type ~* "multipart/form-data") {
        return 415;
    }

    # -----------------------------------------------------------------------
    # /api/execute — strictest limits (code execution)
    # -----------------------------------------------------------------------
    location = /api/execute {
        limit_req          zone=execute burst=6 nodelay;
        limit_conn         perip 4;
        client_max_body_size 16k;

        # Only POST
        limit_except POST { deny all; }

        proxy_pass            http://backend:8080/api/execute;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
        proxy_send_timeout    10s;
        proxy_buffering       off;
    }

    # -----------------------------------------------------------------------
    # /api/* — general API
    # -----------------------------------------------------------------------
    location /api/ {
        limit_req          zone=api burst=30 nodelay;
        client_max_body_size 32k;

        # Only read + execute verbs
        limit_except GET POST HEAD OPTIONS { deny all; }

        proxy_pass            http://backend:8080/api/;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    20s;
        proxy_send_timeout    10s;
    }

    # -----------------------------------------------------------------------
    # Static assets — long-lived cache
    # -----------------------------------------------------------------------
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        # Re-apply security headers (add_header inheritance stops at nested block)
        add_header X-Frame-Options        "DENY"    always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # -----------------------------------------------------------------------
    # SPA fallback
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -----------------------------------------------------------------------
    # Compression
    # -----------------------------------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 5;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
}
