server.port=8080

# ── CORS (set ALLOWED_ORIGIN env var in prod) ──────────────────────────────
app.cors.allowed-origins=${ALLOWED_ORIGIN:http://localhost:3000}

# ── Disable ALL file upload / multipart ───────────────────────────────────
spring.servlet.multipart.enabled=false

# ── Request-size hard caps (defence-in-depth alongside nginx) ─────────────
server.tomcat.max-http-form-post-size=65536
server.tomcat.max-swallow-size=65536
server.tomcat.max-connections=100
server.tomcat.accept-count=20
server.tomcat.threads.max=30
server.tomcat.threads.min-spare=5
server.tomcat.connection-timeout=10000

# ── Never leak internals in error responses ───────────────────────────────
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# ── Hide server identity ───────────────────────────────────────────────────
server.server-header=
server.tomcat.add-default-web-xml-mappings=false

# ── Disable Spring Boot Actuator (no management surface) ──────────────────
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoints.web.exposure.include=health
management.server.port=-1

# ── Serialization hardening ────────────────────────────────────────────────
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.mapper.default-view-inclusion=false
